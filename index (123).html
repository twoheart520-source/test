              { text: '在群組裡發一句「某某客人下週要做修復」，有邏輯地交代完畢。', type: 'B' },
              { text: '跟客人說：「術後有問題妳直接找美容師喔，她們會處理。」', type: 'A' },
              { text: '親自帶著客人介紹給美容師：「姊姊，這是我們最細心的美容師，接下來的修復交給她，我會跟她一起關注您的狀況。」', type: 'D' },
              { text: '覺得手術已經結案，不願表達後續關心。', type: 'A' }
            ]
          },
          {
            id: 24, section: '對內神助攻篇（跨部門的共事默契）',
            question: '客人私下跟美容師抱怨：「剛剛那個諮詢師推銷感太重，我不喜歡。」美容師該如何回應？',
            options: [
              { text: '替同事辯護：「她不是推銷啦，她只是講話比較急。」', type: 'B' },
              { text: '衝動發言：「對啊，她有時候就是這樣，妳別介意。」', type: 'C' },
              { text: '同理並緩頰：「姊姊抱歉讓妳有這種感覺！她其實是看到妳條件太好，急著想幫妳規劃。我等下提醒她稍微踩個煞車。」', type: 'D' },
              { text: '假裝沒聽到，避免衝突趕快轉移話題。', type: 'A' }
            ]
          },
          {
            id: 25, section: '對內神助攻篇（跨部門的共事默契）',
            question: '諮詢師為了成交大單，大方送了幾堂「免費保濕導入」。雖然美容師有半額操作費，但發現診表被塞滿，全額付費的新客和 VIP 都約不進來。美容師該如何溝通？',
            options: [
              { text: '直接跑去抱怨：「妳送一堆耗時間的療程，把診表卡死了，我的 VIP 怎麼辦！」', type: 'B' },
              { text: '拿出數據：「妳送的導入佔據我 30% 時間產值卻減半，請嚴格控管贈送比例。」', type: 'B' },
              { text: '私下達成共識：「恭喜成交大單！不過最近導入卡到接客了，下次我們能改送『ＯＯＯ』嗎？這樣妳好逼單，我們也能接更多客！」', type: 'D' },
              { text: '默默吞下，但幫客人做免費導入時，手法隨便只想趕快下鐘。', type: 'A' }
            ]
          }
        ];

        function App() {
          const [gameState, setGameState] = useState('start');
          const [questions, setQuestions] = useState([]); 
          const [currentIndex, setCurrentIndex] = useState(0);
          const [scores, setScores] = useState({ A: 0, B: 0, C: 0, D: 0 });
          const [mainResult, setMainResult] = useState(null);
          
          // --- 擴充表單欄位狀態 ---
          const [userName, setUserName] = useState('');
          const [gender, setGender] = useState('');
          const [age, setAge] = useState('');
          const [industry, setIndustry] = useState('');
          const [jobTitle, setJobTitle] = useState('');
          const [formError, setFormError] = useState(false);

          const startQuiz = () => {
            // 嚴格驗證所有欄位必填
            if (!userName.trim() || !gender || !age || !industry.trim() || !jobTitle.trim()) {
              setFormError(true);
              return;
            }

            // 將每題的選項順序打亂，維持 1~25 的題號順序
            const randomizedQuestions = MOCK_QUESTIONS.map(q => ({
              ...q,
              options: [...q.options].sort(() => Math.random() - 0.5)
            }));

            setQuestions(randomizedQuestions); 
            setGameState('quiz');
          };

          const handleAnswer = (type) => {
            const newScores = { ...scores, [type]: scores[type] + 1 };
            setScores(newScores);

            if (currentIndex < questions.length - 1) {
              setCurrentIndex(currentIndex + 1);
            } else {
              calculateResult(newScores);
            }
          };

          const calculateResult = (finalScores) => {
            let maxScore = -1;
            let maxType = 'A';
            
            for (const type in finalScores) {
              if (finalScores[type] > maxScore) {
                maxScore = finalScores[type];
                maxType = type;
              }
            }
            setMainResult(maxType);
            setGameState('result');
            
            sendDataToGAS(maxType, finalScores);
          };

          const sendDataToGAS = (type, finalScores) => {
            // 請替換成您在 Google Sheets 上重新「部署」後產生的全新網頁應用程式網址 (Web App URL)
            const gasUrl = 'https://script.google.com/macros/s/AKfycbxom8WTfI28nU9AI4kZSIlaqTe6UFEkknsc-U7GIKPBsgqQshdSw4syymv00y3zvHXl/exec';
            
            const resultTitle = RESULTS_DATA[type].title;
            const details = `懂說(D):${finalScores.D} | 機關槍(B):${finalScores.B} | 亂說(C):${finalScores.C} | 不敢說(A):${finalScores.A}`;

            // 將所有新擴充的學員特徵打包發送
            const formData = new URLSearchParams();
            formData.append('name', userName);
            formData.append('gender', gender);
            formData.append('age', age);
            formData.append('industry', industry);
            formData.append('title', jobTitle);
            formData.append('score', resultTitle); 
            formData.append('details', details);

            fetch(gasUrl, {
              method: 'POST',
              body: formData,
              mode: 'no-cors'
            }).then(() => {
              console.log('🚀 完整的精準學員資料已成功發射到 Google Sheets！');
            }).catch(err => {
              console.error('❌ 資料傳送失敗', err);
            });
          };

          if (gameState === 'start') {
            return (
              <div className="min-h-screen bg-gradient-to-br from-[#FDF8F5] via-[#FFFDF9] to-[#F0F7F4] flex flex-col items-center justify-center p-4 font-sans text-slate-800">
                <div className="bg-white/90 backdrop-blur-md border border-[#F0EBE1] rounded-[2rem] shadow-xl p-8 sm:p-10 max-w-xl w-full text-center relative overflow-hidden my-8">
                  <div className="absolute -top-12 -right-12 w-40 h-40 bg-orange-100 rounded-full blur-3xl opacity-50"></div>
                  <div className="absolute -bottom-12 -left-12 w-40 h-40 bg-emerald-100 rounded-full blur-3xl opacity-50"></div>

                  <div className="relative z-10">
                    <div className="inline-block px-5 py-1.5 bg-emerald-50 text-emerald-600 font-bold rounded-full text-sm mb-6 border border-emerald-100 shadow-sm">
                      課前精準戰力分析
                    </div>
                    <h1 className="text-3xl sm:text-4xl font-extrabold text-slate-800 mb-6 leading-tight tracking-tight">
                      ＴＣＡＡ美業實戰測驗：<br/>
                      <span className="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-orange-400">你是沒溫度的機器人，<br/>還是靈魂操盤手？</span>
                    </h1>
                    
                    <p className="text-slate-600 mb-8 leading-relaxed font-medium text-left">
                      哈囉！業績卡關了嗎？或許你不是不會賣，而是用錯了溝通的頻率！<br/><br/>
                      這份測驗精選了 <span className="font-bold text-orange-500">25 個美業第一線最真實的情境</span>。填寫下方您的個人資訊後，即可開始定位您的說話能力。跟著東明老師，一起避開亂說陷阱，成為看穿客人內心的頂級顧問吧！
                    </p>

                    {/* --- 新增擴充表單資料區 --- */}
                    <div className="space-y-4 mb-8 text-left max-w-md mx-auto">
                      <div>
                        <label className="block text-slate-700 font-bold mb-1.5 text-sm">1. 姓名 / 暱稱：</label>
                        <input 
                          type="text" 
                          value={userName}
                          onChange={(e) => { setUserName(e.target.value); setFormError(false); }}
                          className="w-full px-4 py-3 border-2 border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 bg-white shadow-sm transition-all text-base"
                          placeholder="例如：東明老師、Celine..."
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5 text-sm">2. 性別：</label>
                          <select 
                            value={gender} 
                            onChange={(e) => { setGender(e.target.value); setFormError(false); }}
                            className="w-full px-4 py-3 border-2 border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 bg-white shadow-sm transition-all text-base appearance-none"
                          >
                            <option value="">請選擇</option>
                            <option value="女性">女性</option>
                            <option value="男性">男性</option>
                            <option value="多元/保留">不便透露</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5 text-sm">3. 年齡層：</label>
                          <select 
                            value={age} 
                            onChange={(e) => { setAge(e.target.value); setFormError(false); }}
                            className="w-full px-4 py-3 border-2 border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 bg-white shadow-sm transition-all text-base appearance-none"
                          >
                            <option value="">請選擇</option>
                            <option value="25歲以下">25 歲以下</option>
                            <option value="26-35歲">26-35 歲</option>
                            <option value="36-45歲">36-45 歲</option>
                            <option value="46-55歲">46-55 歲</option>
                            <option value="56歲以上">56 歲以上</option>
                          </select>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5 text-sm">4. 服務產業：</label>
                          <input 
                            type="text" 
                            value={industry}
                            onChange={(e) => { setIndustry(e.target.value); setFormError(false); }}
                            className="w-full px-4 py-3 border-2 border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 bg-white shadow-sm transition-all text-base"
                            placeholder="例如：美業、生技、零售..."
                          />
                        </div>
                        <div>
                          <label className="block text-slate-700 font-bold mb-1.5 text-sm">5. 目前職稱：</label>
                          <input 
                            type="text" 
                            value={jobTitle}
                            onChange={(e) => { setJobTitle(e.target.value); setFormError(false); }}
                            className="w-full px-4 py-3 border-2 border-[#F0EBE1] rounded-xl focus:outline-none focus:border-orange-400 bg-white shadow-sm transition-all text-base"
                            placeholder="例如：諮詢師、美容師、店長..."
                          />
                        </div>
                      </div>

                      {formError && (
                        <p className="text-red-500 text-sm font-bold animate-pulse text-center mt-3">
                          🌟 嘿！欄位還沒填寫完整喔，讓我更認識你吧！
                        </p>
                      )}
                    </div>

                    <button 
                      onClick={startQuiz}
                      className="w-full max-w-md bg-gradient-to-r from-orange-400 to-orange-500 hover:from-orange-500 hover:to-orange-600 text-white font-bold py-4 px-8 rounded-2xl transition duration-300 flex items-center justify-center gap-2 text-lg shadow-lg hover:shadow-xl active:scale-95 mx-auto"
                    >
                      填好了，開始挑戰實戰題！
                    </button>
                  </div>
                </div>
              </div>
            );
          }

          if (gameState === 'quiz') {
            const currentQuestion = questions[currentIndex];
            const progressPercentage = ((currentIndex + 1) / questions.length) * 100;

            return (
              <div className="min-h-screen bg-gradient-to-br from-[#FDF8F5] via-[#FFFDF9] to-[#F0F7F4] flex flex-col items-center p-4 font-sans text-slate-800">
                <div className="w-full max-w-2xl mb-6 mt-4">
                  <div className="flex justify-between items-center text-slate-500 font-bold mb-3 text-sm px-2">
                    <span className="bg-white/80 px-4 py-1.5 rounded-full border border-slate-200 shadow-sm">挑戰者：{userName}</span>
                    <span>{currentIndex + 1} / {questions.length}</span>
                  </div>
                  <div className="w-full bg-[#E5E0D8] h-3 rounded-full overflow-hidden shadow-inner">
                    <div 
                      className="bg-gradient-to-r from-orange-300 via-orange-400 to-orange-500 h-3 rounded-full transition-all duration-500 ease-out"
                      style={{ width: `${progressPercentage}%` }}
                    ></div>
                  </div>
                </div>

                <div className="bg-white rounded-[2rem] shadow-lg p-6 sm:p-10 max-w-2xl w-full border border-[#F0EBE1] relative">
                  <div className="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center">
                    <span className="text-emerald-700 bg-emerald-50 px-4 py-1.5 rounded-full text-sm font-bold border border-emerald-100">
                      {currentQuestion.section}
                    </span>
                  </div>
                  
                  <h2 className="text-xl sm:text-2xl font-bold text-slate-800 mb-8 leading-relaxed">
                    <span className="text-orange-500 mr-2">Q{currentIndex + 1}.</span>
                    {currentQuestion.question}
                  </h2>
                  
                  <div className="space-y-4">
                    {currentQuestion.options.map((option, index) => (
                      <button
                        key={index}
                        onClick={() => handleAnswer(option.type)}
                        className="w-full text-left p-5 rounded-2xl border-2 border-[#F0EBE1] hover:border-orange-400 hover:bg-orange-50/50 transition-all font-medium text-slate-700 active:scale-[0.99] flex items-start group relative overflow-hidden bg-white shadow-sm hover:shadow-md"
                      >
                        <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-orange-400 opacity-0 group-hover:opacity-100 transition-opacity rounded-l-2xl"></div>
                        
                        <span className="inline-block w-8 h-8 rounded-full bg-slate-100 text-slate-500 group-hover:bg-orange-500 group-hover:text-white flex-shrink-0 text-center leading-8 mr-4 text-sm font-bold transition-colors shadow-sm">
                          {String.fromCharCode(65 + index)}
                        </span>
                        <span className="mt-1 leading-relaxed text-base">{option.text}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            );
          }

          if (gameState === 'result') {
            const resultInfo = RESULTS_DATA[mainResult];
            return (
              <div className="min-h-screen bg-gradient-to-br from-[#FDF8F5] via-[#FFFDF9] to-[#F0F7F4] flex flex-col items-center justify-center p-4 font-sans text-slate-800">
                <div className="bg-white rounded-[2rem] shadow-xl p-8 sm:p-10 max-w-lg w-full text-center border border-[#F0EBE1] relative overflow-hidden">
                  
                  <div className="text-orange-600 font-bold mb-3 text-lg bg-orange-50 inline-block px-6 py-2 rounded-full border border-orange-100 shadow-sm">
                    太棒了，{userName}！測驗完成！🎉
                  </div>
                  <h2 className="text-2xl font-extrabold text-slate-800 mb-4 mt-6">你的實戰溝通等級是：</h2>
                  
                  <div className="mb-6 py-8 bg-gradient-to-br from-orange-50 to-[#FFFDF9] rounded-3xl shadow-inner border border-orange-100/50 flex items-center justify-center">
                    <span className="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#F26522] to-orange-400 drop-shadow-sm">
                      {resultInfo.title}
                    </span>
                  </div>
                  
                  <p className="text-slate-700 mb-8 leading-relaxed font-medium text-left bg-emerald-50/60 p-6 rounded-2xl border border-emerald-100/60 shadow-sm">
                    {resultInfo.desc}
                  </p>
                  
                  <div className="bg-white border-2 border-[#F0EBE1] p-6 rounded-2xl mb-8 text-sm text-slate-600 text-left shadow-sm">
                    <p className="font-bold mb-4 text-slate-800 text-base border-b border-slate-100 pb-3 flex items-center">
                      <span className="bg-orange-100 text-orange-600 p-1.5 rounded-lg mr-2">🎯</span> 你的潛意識溝通雷達分析：
                    </p>
                    <ul className="space-y-4 font-medium mt-2">
                      <li className="flex justify-between items-center group">
                        <span className="group-hover:text-orange-600 transition-colors">✨ 靈魂操盤手 (懂說/同理心)</span>
                        <span className="bg-orange-100 text-orange-700 font-bold px-3 py-1 rounded-lg shadow-sm">{scores.D} 次</span>
                      </li>
                      <li className="flex justify-between items-center group">
                        <span className="group-hover:text-emerald-600 transition-colors">🤖 沒溫度的機器人 (機關槍/說教)</span>
                        <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-lg">{scores.B} 次</span>
                      </li>
                      <li className="flex justify-between items-center group">
                        <span className="group-hover:text-slate-800 transition-colors">💣 業績破壞者 (亂說/踩雷)</span>
                        <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-lg">{scores.C} 次</span>
                      </li>
                      <li className="flex justify-between items-center group">
                        <span className="group-hover:text-slate-800 transition-colors">👻 隱形邊緣人 (不敢說/懶說)</span>
                        <span className="bg-slate-100 text-slate-700 px-3 py-1 rounded-lg">{scores.A} 次</span>
                      </li>
                    </ul>
                  </div>

                  <p className="text-emerald-600 font-medium text-xs mb-6 flex items-center justify-center gap-1">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                    你的戰力分析已成功同步至總部系統
                  </p>

                  <button 
                    onClick={() => window.location.reload()}
                    className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 px-8 rounded-2xl transition duration-300 shadow-lg hover:shadow-xl active:scale-95"
                  >
                    回首頁，再測一次
                  </button>
                </div>
              </div>
            );
          }

          return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
